name: 'Greet Action'
description: 'A custom greeting action'
inputs:
  name:
    description: 'The name to greet'
    required: true
    default: 'World'
outputs:
  greeting:
    description: 'The greeting message'
    value: ${{ steps.greet.outputs.message }}
runs:
  using: 'composite'
  steps:
    - id: greet
      shell: bash
      run: |
        MESSAGE="Hello, ${{ inputs.name }}! This is a custom action."
        echo "message=$MESSAGE" >> $GITHUB_OUTPUT
        echo "$MESSAGE"
    - shell: bash
      run: echo "✓ Custom action executed successfully"
