name: Multi-OS Runners

on:
  push:
    branches:
      - main

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3
      
      - name: Display OS Information
        run: |
          echo "========================================"
          echo "Operating System: ${{ runner.os }}"
          echo "Architecture: ${{ runner.arch }}"
          echo "========================================"
        
      - name: Print Detailed System Info (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "OS Name: Ubuntu (Linux)"
          echo "Kernel: $(uname -s)"
          echo "Kernel Version: $(uname -r)"
          
      - name: Print Detailed System Info (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OS Name: macOS"
          echo "Kernel: $(uname -s)"
          echo "Kernel Version: $(uname -r)"
          
      - name: Print Detailed System Info (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "OS Name: Windows"
          cmd /c ver
          
      - name: Check Node Installation
        run: node --version
