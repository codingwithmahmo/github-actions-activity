name: Custom Action Workflow

on:
  push:
    branches:
      - main

jobs:
  use-custom-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Greet Action
        id: greet
        uses: ./.github/actions/greet-action
        with:
          name: 'Mr X'
      
      - name: Display Custom Action Output
        run: |
          echo "Output from custom action:"
          echo "${{ steps.greet.outputs.greeting }}"
