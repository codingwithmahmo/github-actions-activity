name: Secrets & Variables Management

on:
  push:
    branches:
      - main

env:
  GLOBAL_VAR: "shared-value"

jobs:
  secrets-job:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Repository Variables
        run: |
          echo "Environment: ${{ vars.ENV_NAME }}"
          echo "API Endpoint: ${{ vars.API_ENDPOINT }}"
          echo "Global Var: ${{ env.GLOBAL_VAR }}"
          
      - name: Use Secrets (Masked in Logs)
        run: |
          echo "Testing secret access..."
          if [ ! -z "${{ secrets.MY_SECRET }}" ]; then
            echo "✓ MY_SECRET is configured (value masked)"
          fi
          
      - name: Make Authenticated API Call
        env:
          SECRET_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "API Key configured: ${#SECRET_KEY} characters"
          echo "Would authenticate with: ${{ vars.API_ENDPOINT }}"
